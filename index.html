<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שעון היום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: שני טורים — משמאל שעון פומודורו ולוח היום, מימין מטריצת אייזנהאואר; סיכום היום בפס העליון */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #17262a;
  --muted: #5b6c70;
  --line: #d8e0de;
  --accent: #c7861a;
  --accent-ink: #ffffff;
  --q1: #c2452f;
  --q2: #2e7a5b;
  --q3: #2f6390;
  --q4: #7a7f86;
  --focus-ring: #c7861a;
  --f-display: "Suez One", "Assistant", Georgia, serif;
  --f-body: "Assistant", system-ui, "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a1c; --surface: #19252a; --ink: #e6ecea; --muted: #97a8ab; --line: #2b3a3f;
    --accent: #e3a23a; --accent-ink: #1a1305;
    --q1: #e2735e; --q2: #5cb68f; --q3: #6ea3d4; --q4: #a0a6ad; --focus-ring: #e3a23a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a1c; --surface: #19252a; --ink: #e6ecea; --muted: #97a8ab; --line: #2b3a3f;
  --accent: #e3a23a; --accent-ink: #1a1305;
  --q1: #e2735e; --q2: #5cb68f; --q3: #6ea3d4; --q4: #a0a6ad; --focus-ring: #e3a23a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { direction: rtl; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1.1; }
h2 { font-size: 1.25rem; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.date { color: var(--muted); font-size: .95rem; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.stat { display: grid; }
.stat b { font-family: var(--f-mono); font-weight: 500; font-size: 1.5rem; line-height: 1.1; }
.stat span { font-size: .8rem; color: var(--muted); letter-spacing: .02em; }
.week { display: flex; align-items: end; gap: 4px; height: 38px; }
.week i { display: block; width: 12px; background: var(--line); border-radius: 2px 2px 0 0; min-height: 2px; }
.week i.today { background: var(--accent); }

.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

/* add task */
form.add { display: flex; flex-wrap: wrap; gap: 8px; }
form.add input[type=text] { flex: 1 1 220px; min-width: 0; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
.icon-btn { background: none; border: 0; color: var(--muted); padding: 2px 6px; border-radius: 4px; font-size: 1rem; line-height: 1; }
.icon-btn:hover { color: var(--ink); background: var(--bg); }

/* matrix */
.matrix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .matrix { grid-template-columns: minmax(0, 1fr); } }
.quad { border-top: 3px solid var(--qc); background: var(--bg); border-radius: 0 0 8px 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-height: 120px; }
.quad h3 { margin: 0; font-size: .95rem; display: flex; justify-content: space-between; gap: 8px; }
.quad h3 small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.quad[data-q="1"] { --qc: var(--q1); } .quad[data-q="2"] { --qc: var(--q2); }
.quad[data-q="3"] { --qc: var(--q3); } .quad[data-q="4"] { --qc: var(--q4); }
.quad.drop { outline: 2px dashed var(--qc); }
ul.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.task.active { border-color: var(--accent); box-shadow: inset -3px 0 0 var(--accent); }
.task .title { overflow-wrap: anywhere; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.task input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--qc); margin: 0; }
.pips { display: inline-flex; gap: 3px; margin-inline-start: 6px; vertical-align: middle; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--accent); }
.pips i.full { background: var(--accent); }
.task-actions { display: flex; gap: 2px; }
.empty { color: var(--muted); font-size: .85rem; margin: 0; }

/* timer */
.modes { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; }
.modes button { flex: 1; background: none; border: 0; border-radius: 6px; padding: 6px 4px; font-size: .9rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.dial { position: relative; width: min(240px, 100%); aspect-ratio: 1; margin-inline: auto; max-width: 100%; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .track { stroke: var(--line); fill: none; }
.dial .prog { stroke: var(--accent); fill: none; stroke-linecap: round; transition: stroke-dashoffset .4s linear; }
.dial .readout { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .time { font-family: var(--f-mono); font-size: 2.8rem; line-height: 1; direction: ltr; }
.dial .for { font-size: .85rem; color: var(--muted); max-width: 170px; margin-top: 6px; overflow-wrap: anywhere; }
.timer-ctl { display: flex; justify-content: center; gap: 8px; }
.timer-ctl .btn { min-width: 110px; }

/* schedule */
.sched { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); }
.hour { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); height: 40px; border-top: 1px solid var(--line); padding-top: 2px; direction: ltr; text-align: right; }
.hour-line { height: 40px; border-top: 1px solid var(--line); }
.blocks { position: absolute; top: 0; bottom: 0; inset-inline-start: 50px; inset-inline-end: 0; }
.block { position: absolute; inset-inline: 0; background: color-mix(in srgb, var(--q3) 16%, var(--surface)); border-inline-start: 3px solid var(--q3); border-radius: 4px; padding: 2px 8px; font-size: .85rem; overflow: hidden; display: flex; justify-content: space-between; gap: 6px; }
.block .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block small { font-family: var(--f-mono); color: var(--muted); direction: ltr; }
.now { position: absolute; inset-inline: 44px 0; height: 0; border-top: 2px solid var(--q1); }
.now::before { content: ""; position: absolute; inset-inline-start: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--q1); }
.sched-scroll { max-height: 360px; overflow-y: auto; padding-top: 8px; }
form.add-block { display: flex; flex-wrap: wrap; gap: 8px; }
form.add-block input[type=text] { flex: 1 1 140px; min-width: 0; }
form.add-block input[type=time] { width: 7.5em; }
.note { font-size: .8rem; color: var(--muted); }
footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: .85rem; color: var(--muted); }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }
.confirm { display: inline-flex; gap: 8px; align-items: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" lang="he" dir="rtl">
  <header>
    <div>
      <h1>שעון היום</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="stats">
      <div class="stat"><b class="tnum" id="s-pomo">0</b><span>פומודורו היום</span></div>
      <div class="stat"><b class="tnum" id="s-min">0</b><span>דקות ריכוז</span></div>
      <div class="stat"><b class="tnum" id="s-done">0/0</b><span>משימות שהושלמו</span></div>
      <div class="stat"><div class="week" id="week" aria-label="פומודורו בשבעת הימים האחרונים"></div><span>7 ימים אחרונים</span></div>
    </div>
  </header>

  <div class="cols">
    <section class="panel" aria-labelledby="h-tasks">
      <div class="panel-head">
        <h2 id="h-tasks">משימות לפי מטריצת אייזנהאואר</h2>
        <span class="note">גררו משימה בין הרביעים · לחצו ▶ כדי לעבוד עליה</span>
      </div>
      <form class="add" id="add-task">
        <input type="text" id="task-title" placeholder="משימה חדשה…" required aria-label="שם המשימה">
        <select id="task-q" aria-label="רביע">
          <option value="1">דחוף וחשוב</option>
          <option value="2" selected>חשוב, לא דחוף</option>
          <option value="3">דחוף, לא חשוב</option>
          <option value="4">לא דחוף ולא חשוב</option>
        </select>
        <select id="task-est" aria-label="הערכת זמן בפומודורו">
          <option value="1">פומודורו 1</option>
          <option value="2" selected>2 פומודורו</option>
          <option value="3">3 פומודורו</option>
          <option value="4">4 פומודורו</option>
          <option value="6">6 פומודורו</option>
        </select>
        <button class="btn" type="submit">הוספה</button>
      </form>
      <div class="matrix" id="matrix"></div>
    </section>

    <div style="display:grid; gap:20px; min-width:0">
      <section class="panel" aria-labelledby="h-timer">
        <div class="panel-head"><h2 id="h-timer">טיימר פומודורו</h2><span class="note tnum" id="cycle"></span></div>
        <div class="modes" role="group" aria-label="מצב טיימר">
          <button type="button" data-mode="focus" aria-pressed="true">ריכוז 25</button>
          <button type="button" data-mode="short" aria-pressed="false">הפסקה 5</button>
          <button type="button" data-mode="long" aria-pressed="false">הפסקה ארוכה 15</button>
        </div>
        <div class="dial">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="54" stroke-width="6"></circle>
            <circle class="prog" id="prog" cx="60" cy="60" r="54" stroke-width="6"></circle>
          </svg>
          <div class="readout">
            <div class="time tnum" id="time" role="timer" aria-live="off">25:00</div>
            <div class="for" id="for">בחרו משימה</div>
          </div>
        </div>
        <div class="timer-ctl">
          <button class="btn" type="button" id="start">התחלה</button>
          <button class="btn ghost" type="button" id="reset">איפוס</button>
          <button class="btn ghost" type="button" id="skip">דילוג</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-day">
        <div class="panel-head"><h2 id="h-day">לוח הזמנים להיום</h2><span class="note">חסימת זמן</span></div>
        <form class="add-block" id="add-block">
          <input type="text" id="block-title" placeholder="מה עושים?" required aria-label="שם הבלוק">
          <input type="time" id="block-start" value="09:00" required aria-label="שעת התחלה">
          <input type="time" id="block-end" value="10:00" required aria-label="שעת סיום">
          <button class="btn" type="submit">הוספה</button>
        </form>
        <div class="sched-scroll" id="sched-scroll">
          <div class="sched" id="sched"></div>
        </div>
      </section>
    </div>
  </div>

  <footer>
    <span id="store-note">הנתונים נשמרים בדפדפן הזה בלבד.</span>
    <span id="reset-area"><button type="button" id="clear">מחיקת כל הנתונים</button></span>
  </footer>
</div>

<script>
(() => {
  const KEY = 'yom-clock-v1';
  const MODES = { focus: 25, short: 5, long: 15 };
  const QN = { 1: ['דחוף וחשוב', 'לעשות עכשיו'], 2: ['חשוב, לא דחוף', 'לתכנן'], 3: ['דחוף, לא חשוב', 'להאציל'], 4: ['לא דחוף ולא חשוב', 'לוותר'] };
  const HOUR_H = 40, START_H = 6, END_H = 23;
  const $ = s => document.querySelector(s);
  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const todayKey = () => dayKey(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10);

  function sample() {
    const d = todayKey();
    return {
      tasks: [
        { id: uid(), title: 'להגיש דוח רבעוני (דוגמה)', q: 1, est: 3, done: 0, finished: false },
        { id: uid(), title: 'לתכנן את השבוע הבא (דוגמה)', q: 2, est: 1, done: 0, finished: false },
        { id: uid(), title: 'ללמוד פרק בקורס (דוגמה)', q: 2, est: 2, done: 1, finished: false },
        { id: uid(), title: 'לענות למיילים (דוגמה)', q: 3, est: 1, done: 0, finished: false },
        { id: uid(), title: 'לסדר את התמונות בטלפון (דוגמה)', q: 4, est: 1, done: 0, finished: true }
      ],
      blocks: [
        { id: uid(), day: d, title: 'עבודה עמוקה (דוגמה)', start: '09:00', end: '11:00' },
        { id: uid(), day: d, title: 'פגישת צוות (דוגמה)', start: '12:00', end: '12:45' },
        { id: uid(), day: d, title: 'ספורט (דוגמה)', start: '18:00', end: '19:00' }
      ],
      log: {}, activeId: null, cycle: 0
    };
  }

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !state.tasks) state = sample();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- header ---------- */
  $('#today').textContent = new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function renderStats() {
    const n = state.log[todayKey()] || 0;
    $('#s-pomo').textContent = n;
    $('#s-min').textContent = n * MODES.focus;
    $('#s-done').textContent = state.tasks.filter(t => t.finished).length + '/' + state.tasks.length;
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
    const vals = days.map(d => state.log[dayKey(d)] || 0), max = Math.max(4, ...vals);
    $('#week').innerHTML = days.map((d, i) => `<i class="${i === 6 ? 'today' : ''}" style="height:${Math.round(vals[i] / max * 100)}%" title="${d.toLocaleDateString('he-IL', { weekday: 'short' })}: ${vals[i]}"></i>`).join('');
  }

  /* ---------- tasks ---------- */
  function renderTasks() {
    $('#matrix').innerHTML = [1, 2, 3, 4].map(q => {
      const list = state.tasks.filter(t => t.q === q).sort((a, b) => a.finished - b.finished);
      const items = list.map(t => {
        const pips = Array.from({ length: t.est }, (_, i) => `<i class="${i < t.done ? 'full' : ''}"></i>`).join('');
        return `<li class="task ${t.finished ? 'done' : ''} ${state.activeId === t.id ? 'active' : ''}" draggable="true" data-id="${t.id}">
          <input type="checkbox" ${t.finished ? 'checked' : ''} data-act="toggle" aria-label="סימון כהושלם">
          <span class="title">${esc(t.title)}<span class="pips" title="${t.done} מתוך ${t.est} פומודורו">${pips}</span></span>
          <span class="task-actions">
            ${t.finished ? '' : `<button class="icon-btn" data-act="focus" title="לעבוד על המשימה" aria-label="לעבוד על המשימה">▶</button>`}
            <button class="icon-btn" data-act="del" title="מחיקה" aria-label="מחיקה">×</button>
          </span></li>`;
      }).join('');
      return `<div class="quad" data-q="${q}"><h3>${QN[q][0]} <small>${QN[q][1]}</small></h3>
        ${items ? `<ul class="tasks">${items}</ul>` : '<p class="empty">אין משימות כאן</p>'}</div>`;
    }).join('');
  }

  $('#add-task').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#task-title').value.trim();
    if (!title) return;
    state.tasks.push({ id: uid(), title, q: +$('#task-q').value, est: +$('#task-est').value, done: 0, finished: false });
    $('#task-title').value = '';
    save(); renderAll();
  });

  $('#matrix').addEventListener('click', e => {
    const act = e.target.dataset.act; if (!act) return;
    const id = e.target.closest('.task').dataset.id;
    const t = state.tasks.find(x => x.id === id);
    if (act === 'toggle') { t.finished = e.target.checked; if (t.finished && state.activeId === id) state.activeId = null; }
    if (act === 'del') { state.tasks = state.tasks.filter(x => x.id !== id); if (state.activeId === id) state.activeId = null; }
    if (act === 'focus') { state.activeId = id; if (mode !== 'focus') setMode('focus'); }
    save(); renderAll();
  });

  let dragId = null;
  $('#matrix').addEventListener('dragstart', e => { const li = e.target.closest('.task'); if (li) { dragId = li.dataset.id; e.dataTransfer.effectAllowed = 'move'; } });
  $('#matrix').addEventListener('dragover', e => { const q = e.target.closest('.quad'); if (q && dragId) { e.preventDefault(); document.querySelectorAll('.quad').forEach(x => x.classList.toggle('drop', x === q)); } });
  $('#matrix').addEventListener('dragleave', e => { if (!e.relatedTarget || !e.currentTarget.contains(e.relatedTarget)) document.querySelectorAll('.quad').forEach(x => x.classList.remove('drop')); });
  $('#matrix').addEventListener('drop', e => {
    const q = e.target.closest('.quad'); if (!q || !dragId) return;
    e.preventDefault();
    const t = state.tasks.find(x => x.id === dragId); if (t) t.q = +q.dataset.q;
    dragId = null; save(); renderAll();
  });
  $('#matrix').addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.quad').forEach(x => x.classList.remove('drop')); });

  /* ---------- timer ---------- */
  const C = 2 * Math.PI * 54;
  $('#prog').style.strokeDasharray = C;
  let mode = 'focus', remaining = MODES.focus * 60, endAt = null, tick = null, audioCtx = null;

  function setMode(m) {
    mode = m; stop(); remaining = MODES[m] * 60;
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    renderTimer();
  }
  function renderTimer() {
    const mm = String(Math.floor(remaining / 60)).padStart(2, '0'), ss = String(remaining % 60).padStart(2, '0');
    $('#time').textContent = mm + ':' + ss;
    $('#prog').style.strokeDashoffset = C * (1 - remaining / (MODES[mode] * 60));
    const t = state.tasks.find(x => x.id === state.activeId);
    $('#for').textContent = mode === 'focus' ? (t ? t.title : 'בחרו משימה עם ▶') : 'זמן לנשום';
    $('#start').textContent = endAt ? 'השהיה' : (remaining < MODES[mode] * 60 ? 'המשך' : 'התחלה');
    $('#cycle').textContent = `סבב ${state.cycle % 4 + 1} מתוך 4`;
    document.title = endAt ? `${mm}:${ss} · שעון היום` : 'שעון היום';
  }
  function stop() { clearInterval(tick); tick = null; endAt = null; }
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach(d => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        const t0 = audioCtx.currentTime + d;
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);
        o.start(t0); o.stop(t0 + .22);
      });
    } catch (e) {}
  }
  function complete() {
    stop(); beep();
    if (mode === 'focus') {
      const k = todayKey(); state.log[k] = (state.log[k] || 0) + 1;
      const t = state.tasks.find(x => x.id === state.activeId);
      if (t) { t.done++; if (t.done > t.est) t.est = t.done; }
      state.cycle++; save();
      setMode(state.cycle % 4 === 0 ? 'long' : 'short');
    } else setMode('focus');
    renderAll();
  }
  $('#start').addEventListener('click', () => {
    if (audioCtx === null) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = undefined; } }
    if (endAt) { remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000)); stop(); renderTimer(); return; }
    endAt = Date.now() + remaining * 1000;
    tick = setInterval(() => {
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (remaining <= 0) complete(); else renderTimer();
    }, 250);
    renderTimer();
  });
  $('#reset').addEventListener('click', () => setMode(mode));
  $('#skip').addEventListener('click', () => {
    if (mode === 'focus') setMode(state.cycle % 4 === 3 ? 'long' : 'short'); else setMode('focus');
  });
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  /* ---------- schedule ---------- */
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  function renderSched() {
    const d = todayKey();
    let html = '';
    for (let h = START_H; h <= END_H; h++) html += `<div class="hour">${String(h).padStart(2, '0')}:00</div><div class="hour-line"></div>`;
    const blocks = state.blocks.filter(b => b.day === d).sort((a, b) => toMin(a.start) - toMin(b.start));
    html += '<div class="blocks">' + blocks.map(b => {
      const top = (toMin(b.start) - START_H * 60) / 60 * HOUR_H;
      const h = Math.max(20, (toMin(b.end) - toMin(b.start)) / 60 * HOUR_H - 2);
      return `<div class="block" style="top:${top}px;height:${h}px" data-id="${b.id}">
        <span class="t">${esc(b.title)}</span><span><small>${b.start}–${b.end}</small>
        <button class="icon-btn" data-del="${b.id}" aria-label="מחיקת בלוק">×</button></span></div>`;
    }).join('') + '</div>';
    const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
    if (nm >= START_H * 60 && nm <= (END_H + 1) * 60) html += `<div class="now" style="top:${(nm - START_H * 60) / 60 * HOUR_H}px" aria-hidden="true"></div>`;
    $('#sched').innerHTML = html;
  }
  $('#sched').addEventListener('click', e => {
    const id = e.target.dataset.del; if (!id) return;
    state.blocks = state.blocks.filter(b => b.id !== id); save(); renderSched();
  });
  $('#add-block').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#block-title').value.trim(), start = $('#block-start').value, end = $('#block-end').value;
    if (!title || !start || !end) return;
    if (toMin(end) <= toMin(start)) { $('#block-end').setCustomValidity('שעת הסיום צריכה להיות אחרי שעת ההתחלה'); $('#block-end').reportValidity(); return; }
    state.blocks.push({ id: uid(), day: todayKey(), title, start, end });
    $('#block-title').value = '';
    $('#block-start').value = end;
    const e2 = Math.min(toMin(end) + 60, 23 * 60 + 59);
    $('#block-end').value = String(Math.floor(e2 / 60)).padStart(2, '0') + ':' + String(e2 % 60).padStart(2, '0');
    save(); renderSched();
  });
  $('#block-end').addEventListener('input', e => e.target.setCustomValidity(''));

  /* ---------- clear ---------- */
  $('#reset-area').addEventListener('click', e => {
    if (e.target.id === 'clear') {
      $('#reset-area').innerHTML = '<span class="confirm">למחוק הכול? <button type="button" id="yes">כן, למחוק</button><button type="button" id="no">ביטול</button></span>';
    } else if (e.target.id === 'yes') {
      state = { tasks: [], blocks: [], log: {}, activeId: null, cycle: 0 };
      save(); setMode('focus'); renderAll();
      $('#reset-area').innerHTML = '<button type="button" id="clear">מחיקת כל הנתונים</button>';
    } else if (e.target.id === 'no') {
      $('#reset-area').innerHTML = '<button type="button" id="clear">מחיקת כל הנתונים</button>';
    }
  });

  function renderAll() { renderStats(); renderTasks(); renderTimer(); renderSched(); }
  renderAll();
  const nowH = new Date().getHours();
  $('#sched-scroll').scrollTop = Math.max(0, (Math.min(Math.max(nowH, START_H), END_H) - START_H - 1) * HOUR_H);
  setInterval(renderSched, 60000);
})();
</script>
</body>
</html>
