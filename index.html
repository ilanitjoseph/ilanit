<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שעון היום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: "שמיים חיים" — רקע שמשנה צבע לפי השעה האמיתית ביום (שחר, יום, בין ערביים, לילה), לוחות זכוכית מעליו, וטבעת יום של 24 שעות כמרכז */
:root {
  --bg: #eef0f6;
  --surface: #fbfbfe;
  --glass: rgb(255 255 255 / .56);
  --glass-strong: rgb(255 255 255 / .84);
  --glass-edge: rgb(255 255 255 / .85);
  --sunken: rgb(24 26 48 / .06);
  --ink: #15172a;
  --muted: #545873;
  --faint: #8a8ea8;
  --line: rgb(24 26 48 / .1);
  --hand: #ff4f38;
  --hand-2: #ff2f7a;
  --on-hand: #ffffff;
  --primary: #15172a;
  --primary-ink: #ffffff;
  --good: #11875a;
  --late: #d9361f;
  --scrim: rgb(14 16 32 / .32);
  --q1: #e0442c; --q2: #11875a; --q3: #2e63c9; --q4: #7b7f96;
  --p1: #3c55e0; --p2: #00907f; --p3: #c27c0e; --p4: #8b3fd1; --p5: #d43473; --p6: #4a6488;
  --sky-s: 88%; --sky-l: 83%; --sun-l: 72%; --sun-k: 1;
  --h1: 200; --h2: 175; --h3: 45; --sun-x: 50%; --sun-y: 10%; --sun-a: .6;
  --shadow: 0 1px 1px rgb(24 26 48 / .04), 0 18px 40px -22px rgb(24 26 48 / .35);
  --f-display: "Karantina", "Secular One", "Assistant", Impact, sans-serif;
  --f-body: "Assistant", "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07080f; --surface: #161829; --glass: rgb(20 22 38 / .52); --glass-strong: rgb(22 24 42 / .88); --glass-edge: rgb(255 255 255 / .09);
    --sunken: rgb(255 255 255 / .06); --ink: #eceef8; --muted: #a2a6c0; --faint: #6f7392; --line: rgb(255 255 255 / .09);
    --hand: #ff6a4d; --hand-2: #ff4d8d; --on-hand: #ffffff; --primary: #eceef8; --primary-ink: #0b0c16; --good: #3fd09a; --late: #ff7a63;
    --scrim: rgb(0 0 0 / .5);
    --q1: #ff7a62; --q2: #3fd09a; --q3: #72a4ff; --q4: #a1a5bb;
    --p1: #8196ff; --p2: #2fd3bf; --p3: #f0b34e; --p4: #c08bff; --p5: #ff74a8; --p6: #9bb0d0;
    --sky-s: 62%; --sky-l: 20%; --sun-l: 42%; --sun-k: .55;
    --shadow: 0 1px 1px rgb(0 0 0 / .3), 0 22px 48px -24px rgb(0 0 0 / .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07080f; --surface: #161829; --glass: rgb(20 22 38 / .52); --glass-strong: rgb(22 24 42 / .88); --glass-edge: rgb(255 255 255 / .09);
  --sunken: rgb(255 255 255 / .06); --ink: #eceef8; --muted: #a2a6c0; --faint: #6f7392; --line: rgb(255 255 255 / .09);
  --hand: #ff6a4d; --hand-2: #ff4d8d; --on-hand: #ffffff; --primary: #eceef8; --primary-ink: #0b0c16; --good: #3fd09a; --late: #ff7a63;
  --scrim: rgb(0 0 0 / .5);
  --q1: #ff7a62; --q2: #3fd09a; --q3: #72a4ff; --q4: #a1a5bb;
  --p1: #8196ff; --p2: #2fd3bf; --p3: #f0b34e; --p4: #c08bff; --p5: #ff74a8; --p6: #9bb0d0;
  --sky-s: 62%; --sky-l: 20%; --sun-l: 42%; --sun-k: .55;
  --shadow: 0 1px 1px rgb(0 0 0 / .3), 0 22px 48px -24px rgb(0 0 0 / .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { direction: rtl; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hand); outline-offset: 2px; border-radius: 8px; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.eyebrow { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .04em; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- living sky ---------- */
.sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; background:
  radial-gradient(55vmax 45vmax at var(--sun-x) var(--sun-y), hsl(var(--h3) 96% var(--sun-l) / calc(var(--sun-a) * var(--sun-k))), transparent 62%),
  radial-gradient(70vmax 55vmax at 8% 105%, hsl(var(--h2) var(--sky-s) var(--sky-l)), transparent 70%),
  radial-gradient(80vmax 60vmax at 100% 80%, hsl(var(--h1) var(--sky-s) var(--sky-l)), transparent 70%),
  linear-gradient(180deg, hsl(var(--h1) calc(var(--sky-s) * .6) calc(var(--sky-l) + 6%)), var(--bg) 75%);
  transition: background 2s; }
.sky::before, .sky::after { content: ""; position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(60px); opacity: .55; }
.sky::before { background: hsl(var(--h2) var(--sky-s) var(--sky-l)); top: -12vmax; left: -8vmax; animation: drift 38s ease-in-out infinite alternate; }
.sky::after { background: hsl(var(--h3) var(--sky-s) calc(var(--sky-l) - 4%)); bottom: -16vmax; right: 20vmax; opacity: .35; animation: drift 52s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(14vmax, 10vmax) scale(1.15); } }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }

/* ---------- shell ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 16px; margin: 16px 16px 16px 0; height: calc(100vh - 32px); display: flex; flex-direction: column; gap: 22px; padding: 22px 14px; border-radius: 28px; background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.brand svg { width: 30px; height: 30px; }
.brand b { font-family: var(--f-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.nav { display: grid; gap: 3px; }
.nav button { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: var(--muted); padding: 10px 12px; border-radius: 999px; text-align: start; font-size: .98rem; font-weight: 500; transition: background .2s, color .2s; }
.nav button:hover { color: var(--ink); background: var(--sunken); }
.nav button[aria-current="page"] { color: var(--primary-ink); background: var(--primary); }
.nav button[aria-current="page"] .ic { color: var(--hand); }
.nav button .k { margin-inline-start: auto; font-family: var(--f-mono); font-size: .68rem; opacity: .55; }
.rail-timer { margin-top: auto; border-radius: 20px; padding: 14px; display: grid; gap: 8px; background: var(--sunken); }
.rail-timer .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rail-timer .t-time { font-family: var(--f-display); font-size: 2.6rem; line-height: .9; direction: ltr; font-weight: 700; }
.rail-timer .t-task { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-timer .t-mode, .rail-timer .t-cycle { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.round-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: linear-gradient(135deg, var(--hand), var(--hand-2)); color: var(--on-hand); box-shadow: 0 8px 20px -8px var(--hand); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(to left, var(--hand), var(--hand-2)); transform-origin: right; transform: scaleX(0); }
.rail-foot { display: grid; gap: 2px; }
.rail-foot button { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 999px; font-size: .9rem; text-align: start; }
.rail-foot button:hover { color: var(--ink); background: var(--sunken); }
.rail-foot kbd { margin-inline-start: auto; font-family: var(--f-mono); font-size: .66rem; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; direction: ltr; }

.main { min-width: 0; padding-inline: clamp(16px, 3vw, 40px); padding-block: 26px 60px; display: grid; gap: 22px; align-content: start; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; border-radius: 999px; padding: 8px 18px; font-size: .88rem; color: var(--muted); background: var(--glass); border: 1px dashed var(--faint); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.banner button { background: none; border: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.banner button.armed { color: var(--late); }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; }
.top h1 { font-family: var(--f-display); font-size: clamp(3.4rem, 7vw, 6rem); line-height: .82; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
.top .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 5px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.top-timer { display: none !important; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: var(--primary); color: var(--primary-ink); padding: 8px 17px; border-radius: 999px; font-weight: 600; font-size: .92rem; white-space: nowrap; transition: transform .15s, filter .15s; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--glass-strong); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface); filter: none; }
.btn.hand { background: linear-gradient(135deg, var(--hand), var(--hand-2)); color: var(--on-hand); box-shadow: 0 8px 20px -10px var(--hand); }
.btn.danger { background: none; color: var(--late); border-color: var(--line); }
.btn.armed { background: var(--late); color: var(--on-hand); border-color: var(--late); }
.btn.sm { padding: 6px 12px; font-size: .84rem; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; background: none; border: 0; color: var(--muted); border-radius: 50%; padding: 0; }
.icon-btn:hover { color: var(--ink); background: var(--sunken); }
.icon-btn.armed { color: var(--on-hand); background: var(--late); }
input:not([type=checkbox]):not([type=range]), select, textarea { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 14px; padding: 8px 13px; min-width: 0; }
textarea { resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--faint); }
.seg { display: inline-flex; background: var(--sunken); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-size: .88rem; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.check { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 1.7px solid var(--faint); border-radius: 50%; margin: 0; display: inline-grid; place-items: center; background: transparent; flex: none; cursor: pointer; transition: background .15s, border-color .15s; }
.check:hover { border-color: var(--c, var(--ink)); }
.check:checked { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); }
.check:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

/* ---------- cards ---------- */
.card, .kpi, .quad, .wk-scroll { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
.card { border-radius: var(--r); padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.card-head h2 { font-family: var(--f-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
.due { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); white-space: nowrap; }
.due.today { color: var(--ink); font-weight: 500; }
.due.late { color: var(--late); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1.4px solid var(--faint); }
.pips i.full { background: var(--hand); border-color: var(--hand); }
.empty { color: var(--faint); font-size: .9rem; margin: 0; padding: 6px 0; }
.stack { display: grid; gap: 18px; min-width: 0; align-content: start; }

/* task row */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-top: 1px solid var(--line); transition: background .15s; border-radius: 14px; }
.tl > .tr:first-child { border-top-color: transparent; }
.tr:hover { background: var(--sunken); }
.tr .body { display: grid; gap: 3px; min-width: 0; cursor: pointer; border-radius: 8px; }
.tr .title { overflow-wrap: anywhere; line-height: 1.35; font-weight: 500; }
.tr .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.tr.done .title { color: var(--faint); text-decoration: line-through; font-weight: 400; }
.tr .acts { display: flex; gap: 2px; }
.tr.active { background: linear-gradient(to left, color-mix(in srgb, var(--hand) 16%, transparent), transparent 80%); }
.tr.active .play { color: var(--on-hand); background: linear-gradient(135deg, var(--hand), var(--hand-2)); }
.subc { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.qtag { font-family: var(--f-mono); font-size: .66rem; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 999px; padding: 1px 8px; }

/* ---------- today: day ring hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
.ringcard { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: 22px; align-items: center; }
.dayring { width: 100%; max-width: 300px; aspect-ratio: 1; display: block; }
.dayring .track { fill: none; stroke: var(--sunken); stroke-width: 16; }
.dayring .night { fill: none; stroke: var(--line); stroke-width: 16; }
.dayring .blk { fill: none; stroke-width: 14; }
.dayring .ses { fill: none; stroke: var(--hand); stroke-width: 5; stroke-linecap: round; opacity: .9; }
.dayring .elapsed { fill: none; stroke: var(--ink); stroke-width: 1.5; opacity: .35; stroke-dasharray: 2 3; }
.dayring .tick { stroke: var(--faint); stroke-width: 1.2; }
.dayring .tick.major { stroke: var(--ink); stroke-width: 2; }
.dayring text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.dayring .now { stroke: var(--hand); stroke-width: 2.4; stroke-linecap: round; }
.dayring .nowdot { fill: var(--hand); filter: drop-shadow(0 0 6px var(--hand)); }
.dayring .big { font-family: var(--f-display); font-size: 64px; font-weight: 700; fill: var(--ink); }
.dayring .sub { font-family: var(--f-body); font-size: 11.5px; fill: var(--muted); }
.ring-legend { display: grid; gap: 10px; font-size: .88rem; color: var(--muted); }
.ring-legend b { color: var(--ink); font-weight: 600; }
.ring-legend .lg { display: flex; gap: 10px; align-items: center; }
.ring-legend .sw { width: 22px; height: 6px; border-radius: 3px; flex: none; }
.phase { font-family: var(--f-display); font-size: 2.6rem; font-weight: 700; line-height: .9; color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.kpi { border-radius: var(--r); padding: 18px 20px; display: flex; align-items: center; gap: 14px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 3.4rem; line-height: .85; font-weight: 700; }
.kpi .v small { font-family: var(--f-body); font-size: .9rem; color: var(--muted); font-weight: 500; }
.kpi .l { font-size: .84rem; color: var(--muted); margin-top: 6px; }
.ring { width: 56px; height: 56px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--sunken); }
.ring .fg { stroke: var(--hand); stroke-linecap: round; }
.today-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.quick { display: flex; gap: 8px; }
.quick input { flex: 1; border-radius: 999px !important; padding-inline: 18px !important; }
.tline { list-style: none; margin: 0; padding: 0; display: grid; }
.tline li { display: grid; grid-template-columns: 50px 14px minmax(0, 1fr); gap: 10px; align-items: start; padding-block: 6px; }
.tline .h { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); direction: ltr; text-align: left; padding-top: 2px; }
.tline .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); margin-top: 5px; background: var(--surface); }
.tline li.past { opacity: .45; }
.tline li.now .dot { background: var(--c); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 25%, transparent); }
.tline .what { display: grid; min-width: 0; }
.tline .what b { font-weight: 600; overflow-wrap: anywhere; }
.tline .what span { font-size: .8rem; color: var(--muted); }
.tline li.nowline { grid-template-columns: 50px minmax(0, 1fr); align-items: center; padding-block: 2px; }
.tline .nowline .h { color: var(--hand); }
.tline .nowline hr { border: 0; height: 2px; background: linear-gradient(to left, var(--hand), transparent); margin: 0; }
.mini-timer { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 16px; align-items: center; }
.mini-timer .dialwrap { width: 124px; }
.mini-timer .info { display: grid; gap: 6px; min-width: 0; justify-items: start; }
.mini-timer .t-time { font-family: var(--f-display); font-size: 3.6rem; font-weight: 700; line-height: .85; direction: ltr; }
.mini-timer .t-task { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.hb-today { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hb-today li { display: flex; align-items: center; gap: 10px; }
.hb-today .streak { margin-inline-start: auto; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }

/* ---------- tasks ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .search { position: relative; flex: 1 1 220px; display: flex; min-width: 0; }
.toolbar .search input { flex: 1; padding-inline-start: 38px; border-radius: 999px; }
.toolbar .search .ic { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.toolbar select { border-radius: 999px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); cursor: pointer; }
.axis-x { display: grid; grid-template-columns: 26px repeat(2, minmax(0, 1fr)); gap: 14px; font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; color: var(--faint); text-align: center; margin-bottom: 4px; line-height: 1; }
.axis { display: grid; grid-template-columns: 26px minmax(0, 1fr); }
.axis-y { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; }
.axis-y span { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; color: var(--faint); justify-self: center; line-height: 1; }
.matrix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* ---------- focus ---------- */

.hbars { display: grid; gap: 12px; }

.qmini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.qmini b { font-family: var(--f-display); font-size: 2.6rem; font-weight: 700; line-height: .9; }
.qmini span { font-size: .8rem; }
.hm-legend { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--faint); }
.hm-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.note { font-size: .9rem; color: var(--muted); margin: 0; max-width: 62ch; }

/* ---------- drawer, palette, toast ---------- */

/* ---------- responsive ---------- */
@media (max-width: 1200px) {

}

/* ================= living sky ================= */
const SKY = [[0, 236, 262, 214], [4.5, 245, 290, 20], [6, 16, 336, 38], [8, 198, 172, 46], [13, 194, 166, 48], [16.5, 206, 186, 40], [18, 26, 348, 30], [19.5, 280, 330, 18], [21, 238, 264, 214], [24, 236, 262, 214]];
function phaseName(h) { return h < 5 ? 'לילה' : h < 7.5 ? 'שחר' : h < 12 ? 'בוקר' : h < 16.5 ? 'צהריים' : h < 19.5 ? 'בין ערביים' : 'לילה'; }
function sky() {
  const n = new Date(), h = n.getHours() + n.getMinutes() / 60;
  let i = 0; while (SKY[i + 1][0] <= h) i++;
  const [a, ...A] = SKY[i], [b, ...B] = SKY[i + 1], f = (h - a) / (b - a);
  const mix = (x, y) => { const d = ((y - x + 540) % 360) - 180; return Math.round((x + d * f + 360) % 360); };
  const st = document.documentElement.style;
  A.forEach((x, j) => st.setProperty('--h' + (j + 1), mix(x, B[j])));
  const day = clamp((h - 5) / 16, 0, 1);
  st.setProperty('--sun-x', (86 - 72 * day).toFixed(1) + '%');
  st.setProperty('--sun-y', (4 + (1 - Math.sin(day * Math.PI)) * 30).toFixed(1) + '%');
  st.setProperty('--sun-a', h < 5 || h > 21 ? '.22' : '.62');
}

function dayRing(blocks) {
  const c = 170, R = 128, now = new Date(), nowH = now.getHours() + now.getMinutes() / 60;

  const pt = (r, a) => { const t = (a - 90) * Math.PI / 180; return [(c + r * Math.cos(t)).toFixed(2), (c + r * Math.sin(t)).toFixed(2)]; };
  const arc = (r, h0, h1) => { if (h1 - h0 >= 24) h1 = h0 + 23.999; const [x0, y0] = pt(r, ang(h0)), [x1, y1] = pt(r, ang(h1)); return `M${x0} ${y0} A${r} ${r} 0 ${h1 - h0 > 12 ? 1 : 0} 1 ${x1} ${y1}`; };
  const ds = S().dayStart, de = S().dayEnd;
  let g = `<circle class="track" cx="${c}" cy="${c}" r="${R}"/>`;
  if (de < 24) g += `<path class="night" d="${arc(R, de, 24)}"/>`;
  if (ds > 0) g += `<path class="night" d="${arc(R, 0, ds)}"/>`;
  for (let h = 0; h < 24; h++) { const mj = h % 6 === 0, [x0, y0] = pt(R + 12, ang(h)), [x1, y1] = pt(R + (mj ? 20 : 16), ang(h)); g += `<line class="tick ${mj ? 'major' : ''}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; }
  [0, 6, 12, 18].forEach(h => { const [x, y] = pt(R + 32, ang(h)); g += `<text x="${x}" y="${(+y + 3.5).toFixed(1)}" text-anchor="middle">${pad(h)}</text>`; });

  return `<svg class="dayring" viewBox="0 0 340 340" role="img" aria-label="טבעת היום: ${blocks.length} בלוקים מתוכננים, השעה ${pad(now.getHours())}:${pad(now.getMinutes())}">${g}</svg>`;
}

function filteredTasks() {
  const q = ui.search.trim().toLowerCase();

}
function taskBody() {
  const body = $('#t-body'); if (!body) return;
  const list = filteredTasks();
  const byDue = (a, b) => a.finished - b.finished || (a.due || '9').localeCompare(b.due || '9') || a.q - b.q;
  if (state.ui.taskMode === 'matrix') {
    const quad = q => {
      const ts = list.filter(t => t.q === q).sort(byDue);
      const open = state.tasks.filter(t => t.q === q && !t.finished);
      const est = open.reduce((a, t) => a + Math.max(0, t.est - t.done), 0);
      return `<section class="quad" data-q="${q}" style="--c:${Q[q].c}">
        <div class="quad-h"><h3>${Q[q].n}</h3><span class="verb">${Q[q].a}</span></div>

      <div class="matrix">${quad(1)}${quad(2)}${quad(3)}${quad(4)}</div></div>`;
  } else {
    const g = { late: [], today: [], tomorrow: [], week: [], later: [], none: [], done: [] };
    list.forEach(t => {
      if (t.finished) return g.done.push(t);
      if (!t.due) return g.none.push(t);
      const d = dayDiff(t.due);
      (d < 0 ? g.late : d === 0 ? g.today : d === 1 ? g.tomorrow : d < 7 ? g.week : g.later).push(t);
    });
    const names = { late: 'באיחור', today: 'היום', tomorrow: 'מחר', week: 'השבוע', later: 'בהמשך', none: 'ללא תאריך', done: 'הושלמו' };

    body.innerHTML = `<div class="card">${html ? `<div class="groups">${html}</div>` : '<p class="empty">לא נמצאו משימות.</p>'}</div>`;
  }
}

const HH = 48;
function vWeek() {
  const now = new Date();
  const ws = addDays(now, -now.getDay() + ui.weekOffset * 7), we = addDays(ws, 6);
  header('שבוע', `<button type="button" class="btn" data-act="new-block">${ic('plus')}בלוק חדש</button>`);
  const sH = S().dayStart, eH = S().dayEnd, hours = eH - sH;
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const nm = now.getHours() * 60 + now.getMinutes();
  const head = days.map(d => {
    const k = dk(d), planned = state.blocks.filter(b => b.day === k).reduce((a, b) => a + toMin(b.end) - toMin(b.start), 0), f = focusMin(k);
    return `<div class="wk-day ${k === today() ? 'today' : ''}"><b>${DAYN[d.getDay()]}</b><span class="n tnum">${d.getDate()}</span><small>${planned ? 'תוכנן ' + fmtH(planned) : 'ללא תכנון'}${f ? ' · בפועל ' + fmtH(f) : ''}</small></div>`;
  }).join('');
  const cols = days.map(d => {
    const k = dk(d);
    const bl = state.blocks.filter(b => b.day === k).map(b => {
      const top = (toMin(b.start) - sH * 60) / 60 * HH, h = Math.max(22, (toMin(b.end) - toMin(b.start)) / 60 * HH - 3);
      return `<div class="wb" data-bid="${b.id}" style="top:${top}px;height:${h}px;--c:${pcolor(b.projectId)}" tabindex="0" role="button" aria-label="${esc(b.title)} ${b.start} עד ${b.end}"><b>${esc(b.title || 'ללא שם')}</b>${h > 34 ? `<span>${b.start}–${b.end}</span>` : ''}</div>`;
    }).join('');
    const ss = sessDay(k).map(s => { const st = new Date(s.start), m = st.getHours() * 60 + st.getMinutes(); return m < sH * 60 || m >= eH * 60 ? '' : `<i class="ws" style="top:${(m - sH * 60) / 60 * HH}px;height:${Math.max(3, s.min / 60 * HH)}px;--c:${pcolor(s.projectId)}"></i>`; }).join('');
    const nowL = k === today() && nm >= sH * 60 && nm <= eH * 60 ? `<div class="wnow" style="top:${(nm - sH * 60) / 60 * HH}px"></div>` : '';
    return `<div class="wcol ${k === today() ? 'today' : ''}" data-day="${k}">${bl}${ss}${nowL}</div>`;
  }).join('');
  const labels = Array.from({ length: hours }, (_, i) => i === 0 ? '' : `<span style="top:${i * HH}px">${pad(sH + i)}:00</span>`).join('');
  const rangeTxt = ws.getMonth() === we.getMonth() ? `${ws.getDate()}–${we.getDate()} ב${MONTHS[we.getMonth()]}` : `${ws.getDate()} ב${MONTHS[ws.getMonth()]} – ${we.getDate()} ב${MONTHS[we.getMonth()]}`;
  $('#view').innerHTML = `
  <div class="stack" style="gap:14px">
    <div class="wk-tools">
      <div class="row-btns">
        <button type="button" class="btn ghost sm" data-act="wk" data-d="-1">${ic('right')}שבוע קודם</button>

        <button type="button" class="btn ghost sm" data-act="wk" data-d="1">שבוע הבא${ic('left')}</button>
      </div>

    </div>
    <div class="wk-scroll" id="wk-scroll"><div class="wk">
      <div class="wk-head"><div></div>${head}</div>
      <div class="wk-body" style="height:${hours * HH}px"><div class="wk-hours">${labels}</div>${cols}</div>
    </div></div>
    <div class="legend"><span>לחיצה על משבצת ריקה יוצרת בלוק · גרירה מזיזה אותו</span><span><i class="sw"></i>פס דק בקצה = זמן ריכוז שנרשם בפועל</span>${state.projects.map(p => `<span class="chip" style="--c:var(--${p.color})">${esc(p.name)}</span>`).join('')}</div>
  </div>`;
  $('#wk-scroll').scrollTop = Math.max(0, ((ui.weekOffset === 0 ? now.getHours() : 9) - sH - 1) * HH);
}
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.wb'); if (!el || e.button > 0) return;
  const b = state.blocks.find(x => x.id === el.dataset.bid); if (!b) return;
  drag = { el, b, y0: e.clientY, x0: e.clientX, moved: false, dm: toMin(b.start), day: b.day };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0, dx = e.clientX - drag.x0;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true; drag.el.classList.add('dragging');
  const len = toMin(drag.b.end) - toMin(drag.b.start), sH = S().dayStart * 60, eH = S().dayEnd * 60;
  const ns = clamp(Math.round((toMin(drag.b.start) + dy / HH * 60) / 15) * 15, sH, Math.max(sH, eH - len));
  drag.dm = ns;
  drag.el.style.top = (ns - sH) / 60 * HH + 'px';
  const under = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains('wcol'));
  if (under && under.dataset.day !== drag.day) { drag.day = under.dataset.day; under.appendChild(drag.el); }
  const sp = drag.el.querySelector('span'); if (sp) sp.textContent = fromMin(ns) + '–' + fromMin(ns + len);
});
const endDrag = () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { openBlock(d.b.id); return; }
  const len = toMin(d.b.end) - toMin(d.b.start);
  d.b.start = fromMin(d.dm); d.b.end = fromMin(d.dm + len); d.b.day = d.day;
  save(); render(); toast(`הבלוק הוזז ליום ${DAYN[pk(d.day).getDay()]}, ${d.b.start}`);
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });

/* ================= view: insights ================= */
function vInsights() {
  header('תובנות');
  const now = new Date(), goal = S().dailyGoal * S().focus;
  const sumRange = (a, b) => { let m = 0; for (let i = a; i < b; i++) m += focusMin(dk(addDays(now, -i))); return m; };
  const w1 = sumRange(0, 7), w0 = sumRange(7, 14);
  const delta = w0 ? Math.round((w1 - w0) / w0 * 100) : 0;
  let best = { m: 0, k: null }; for (let i = 0; i < 30; i++) { const k = dk(addDays(now, -i)), m = focusMin(k); if (m > best.m) best = { m, k }; }
  const doneWeek = state.tasks.filter(t => t.finished && t.finishedAt && Date.now() - t.finishedAt < 7 * 864e5).length;
  let goalDays = 0; for (let i = 0; i < 7; i++) if (focusMin(dk(addDays(now, -i))) >= goal) goalDays++;

  /* chart 1: last 14 days, time flows right to left */
  const W = 640, H = 220, pl = 12, pr = 46, pt = 18, pb = 26, n = 14;
  const vals = Array.from({ length: n }, (_, i) => { const d = addDays(now, -(n - 1 - i)); return { d, m: focusMin(dk(d)) }; });
  const rawTop = Math.max(60, Math.max(goal, ...vals.map(v => v.m)) * 1.1), top = Math.ceil(rawTop / (rawTop <= 240 ? 60 : rawTop <= 480 ? 120 : 180)) * (rawTop <= 240 ? 60 : rawTop <= 480 ? 120 : 180);
  const y = v => pt + (H - pt - pb) * (1 - v / top), cw = (W - pl - pr) / n, bw = cw * .56;
  const xOf = i => W - pr - (i + 1) * cw + (cw - bw) / 2;
  let c1 = '';
  const tstep = top <= 240 ? 60 : top <= 480 ? 120 : 180;
  for (let t = 0; t <= top; t += tstep) { c1 += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${W - pr + 8}" y="${y(t) + 3.5}">${fmtH(t)}</text>`; }
  vals.forEach((v, j) => { const i = n - 1 - j; const cls = j === n - 1 ? 'today' : v.m >= goal ? 'met' : ''; c1 += `<rect class="col ${cls}" x="${xOf(i)}" y="${y(v.m)}" width="${bw}" height="${Math.max(0, H - pb - y(v.m))}" rx="3"><title>יום ${DAYN[v.d.getDay()]} ${v.d.getDate()}.${v.d.getMonth() + 1}: ${fmtH(v.m)}</title></rect><text x="${xOf(i) + bw / 2}" y="${H - 8}" text-anchor="middle">${DAYS[v.d.getDay()]}</text>`; });
  c1 += `<line class="goal" x1="${pl}" x2="${W - pr}" y1="${y(goal)}" y2="${y(goal)}"/><text class="goal-t" x="${pl}" y="${y(goal) - 5}">יעד ${fmtH(goal)}</text>`;

  /* chart 2: heatmap, newest week on the left */
  const weeks = 22, cs = 13, gap = 3, HW = weeks * (cs + gap) + 26, HHt = 7 * (cs + gap) + 20;
  const endSun = addDays(now, -now.getDay());
  const lvl = m => m === 0 ? 0 : m < 60 ? 1 : m < 120 ? 2 : m < 180 ? 3 : 4;
  const hmFill = ['var(--sunken)', 'color-mix(in srgb, var(--hand) 28%, var(--sunken))', 'color-mix(in srgb, var(--hand) 52%, var(--sunken))', 'color-mix(in srgb, var(--hand) 76%, var(--sunken))', 'var(--hand)'];
  let c2 = '';
  for (let w = 0; w < weeks; w++) {
    const sun = addDays(endSun, -w * 7), x = HW - 26 - (w + 1) * (cs + gap);
    for (let d = 0; d < 7; d++) {
      const day = addDays(sun, d); if (day > now) continue;
      const m = focusMin(dk(day));
      c2 += `<rect x="${x}" y="${16 + d * (cs + gap)}" width="${cs}" height="${cs}" rx="2.5" fill="${hmFill[lvl(m)]}"><title>${day.getDate()}.${day.getMonth() + 1}: ${fmtH(m)}</title></rect>`;
    }
    if (sun.getDate() <= 7) c2 += `<text x="${x + cs}" y="10" text-anchor="end">${MONTHS[sun.getMonth()]}</text>`;
  }
  [0, 2, 4, 6].forEach(d => c2 += `<text x="${HW - 2}" y="${16 + d * (cs + gap) + 10}" text-anchor="end">${DAYS[d]}</text>`);

  /* chart 3: projects, 30 days */
  const pm = {}; state.sessions.filter(s => Date.now() - s.start < 30 * 864e5).forEach(s => { const k = s.projectId || ''; pm[k] = (pm[k] || 0) + s.min; });
  const pmax = Math.max(1, ...Object.values(pm));
  const bars = Object.entries(pm).sort((a, b) => b[1] - a[1]).map(([id, m]) => { const p = proj(id); return `<div class="hbar" style="--c:${p ? `var(--${p.color})` : 'var(--faint)'}"><span>${esc(p ? p.name : 'ללא פרויקט')}</span><span class="track"><i style="width:${m / pmax * 100}%"></i></span><span class="n tnum">${fmtH(m)}</span></div>`; }).join('');

  /* chart 4: hour of day, 60 days */
  const hrs = Array(24).fill(0); state.sessions.filter(s => Date.now() - s.start < 60 * 864e5).forEach(s => hrs[new Date(s.start).getHours()] += s.min);
  const hmax = Math.max(1, ...hrs), W4 = 640, H4 = 150, h0 = 6, h1 = 23, span = h1 - h0 + 1, cw4 = (W4 - 20) / span;
  const peak = hrs.indexOf(Math.max(...hrs));
  let c4 = '';
  for (let hh = h0; hh <= h1; hh++) { const i = hh - h0, x = W4 - 10 - (i + 1) * cw4, bh = hrs[hh] / hmax * (H4 - 34); c4 += `<rect class="col ${hh === peak && hrs[hh] ? 'today' : ''}" x="${x + cw4 * .18}" y="${H4 - 20 - bh}" width="${cw4 * .64}" height="${bh}" rx="2.5"><title>${pad(hh)}:00 · ${fmtH(hrs[hh])}</title></rect>${hh % 3 === 0 ? `<text x="${x + cw4 / 2}" y="${H4 - 5}" text-anchor="middle">${pad(hh)}:00</text>` : ''}`; }
  c4 += `<line class="grid" x1="10" x2="${W4 - 10}" y1="${H4 - 20}" y2="${H4 - 20}"/>`;

  /* quadrant balance */
  const qm = { 1: 0, 2: 0, 3: 0, 4: 0 }; let qt = 0;
  state.sessions.filter(s => s.taskId && Date.now() - s.start < 30 * 864e5).forEach(s => { const t = task(s.taskId); if (t) { qm[t.q] += s.min; qt += s.min; } });
  const qpct = q => qt ? Math.round(qm[q] / qt * 100) : 0;

  $('#view').innerHTML = `
  <div class="stack" style="gap:24px">
    <section class="ins-kpis">
      <div class="ins-kpi"><span class="l">ריכוז ב־7 הימים האחרונים</span><span class="v tnum">${fmtH(w1)}</span><span class="d ${w0 ? (delta >= 0 ? 'up' : 'down') : ''}">${w0 ? (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '% לעומת השבוע שלפני' : 'אין עדיין נתון להשוואה'}</span></div>
      <div class="ins-kpi"><span class="l">ממוצע ליום</span><span class="v tnum">${fmtH(w1 / 7)}</span><span class="d">${goalDays} מתוך 7 ימים הגיעו ליעד</span></div>
      <div class="ins-kpi"><span class="l">היום הכי מרוכז בחודש</span><span class="v tnum">${fmtH(best.m)}</span><span class="d">${best.k ? 'יום ' + DAYN[pk(best.k).getDay()] + ', ' + pk(best.k).getDate() + '.' + (pk(best.k).getMonth() + 1) : '—'}</span></div>
      <div class="ins-kpi"><span class="l">משימות שהושלמו השבוע</span><span class="v tnum">${doneWeek}</span><span class="d">רצף נוכחי: ${streakDays()} ימים</span></div>
    </section>
    <div class="ins-grid">
      <section class="card wide"><div class="card-head"><h2>דקות ריכוז, שבועיים אחרונים</h2><span class="eyebrow">ירוק = הגעה ליעד · אדום = היום</span></div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף דקות ריכוז יומיות">${c1}</svg></section>
      <section class="card wide"><div class="card-head"><h2>מפת חום, 22 שבועות</h2><span class="hm-legend">פחות ${hmFill.map(f => `<i style="background:${f}"></i>`).join('')} יותר</span></div>
        <div class="chart-scroll"><svg class="chart" viewBox="0 0 ${HW} ${HHt}" style="min-width:${HW}px;max-width:${Math.round(HW * 1.7)}px" role="img" aria-label="מפת חום של ימי ריכוז">${c2}</svg></div></section>
      <section class="card"><div class="card-head"><h2>לאן הלך הזמן</h2><span class="eyebrow">30 יום · לפי פרויקט</span></div>
        ${bars ? `<div class="hbars">${bars}</div>` : '<p class="empty">עוד אין סבבי ריכוז.</p>'}</section>
      <section class="card"><div class="card-head"><h2>איזון אייזנהאואר</h2><span class="eyebrow">30 יום · זמן ריכוז לפי רביע</span></div>
        <div class="qmini">${[1, 2, 3, 4].map(q => `<div style="--c:${Q[q].c};--w:${Math.round(qpct(q) * .8)}%"><b class="tnum">${qpct(q)}%</b><span>${Q[q].n}</span></div>`).join('')}</div>
        <p class="note">${qt ? (qpct(2) >= 40 ? 'רוב הזמן הולך לדברים חשובים שעוד לא בוערים. זה הרביע שבו נבנית התקדמות אמיתית.' : 'רוב הזמן הולך לכיבוי שריפות. כדאי לשריין בלוקים קבועים בלוח השבועי למשימות "חשוב, לא דחוף".') : 'כשסבבי ריכוז ישויכו למשימות, יופיע כאן פילוח לפי רביע.'}</p></section>
      <section class="card wide"><div class="card-head"><h2>השעות החזקות</h2><span class="eyebrow">60 יום · השעה הבולטת באדום</span></div>
        <svg class="chart" viewBox="0 0 ${W4} ${H4}" role="img" aria-label="התפלגות הריכוז לפי שעה ביום">${c4}</svg>
        <p class="note">${hrs[peak] ? `השעה הפורייה ביותר היא ${pad(peak)}:00. כדאי לשמור אותה למשימות הקשות ולא לפגישות.` : 'אחרי כמה סבבים יופיע כאן באילו שעות הריכוז בשיא.'}</p></section>
    </div>
  </div>`;
}

/* ================= palette & quick add ================= */
let palItems = [], palSel = 0;
function parseQuick(text) {
  const out = { title: text, q: null, projectId: null, due: null, est: 1, newProj: null };
  let t = ' ' + text + ' ';
  t = t.replace(/\s!([1-4])(?=\s)/, (_, q) => { out.q = +q; return ' '; });
  t = t.replace(/\s~(\d{1,2})(?=\s)/, (_, n) => { out.est = clamp(+n, 1, 40); return ' '; });
  t = t.replace(/\s#([^\s#]+)(?=\s)/, (_, n) => { const p = state.projects.find(x => x.name.startsWith(n)); if (p) out.projectId = p.id; else out.newProj = n; return ' '; });
  t = t.replace(/\s(היום|מחרתיים|מחר)(?=\s)/, (_, w) => { out.due = dk(addDays(new Date(), w === 'היום' ? 0 : w === 'מחר' ? 1 : 2)); return ' '; });
  t = t.replace(/\s(\d{1,2})[./](\d{1,2})(?=\s)/, (_, d, m) => { const n = new Date(); const dt = new Date(n.getFullYear(), +m - 1, +d); if (dt < addDays(n, -1)) dt.setFullYear(n.getFullYear() + 1); out.due = dk(dt); return ' '; });
  out.title = t.replace(/\s+/g, ' ').trim();
  return out;
}
function addTask(p) {
  if (!p.title) return null;
  if (p.newProj) { const np = { id: uid(), name: p.newProj, color: COLORS[state.projects.length % COLORS.length] }; state.projects.push(np); p.projectId = np.id; }
  const t = { id: uid(), title: p.title, q: p.q || 2, projectId: p.projectId, due: p.due, est: p.est, done: 0, finished: false, finishedAt: null, createdAt: Date.now(), notes: '', subtasks: [] };
  state.tasks.push(t); save(); return t;
}
function openPalette() { $('#palette').hidden = false; $('#pal-input').value = ''; palette(''); $('#pal-input').focus(); }
function closePalette() { $('#palette').hidden = true; }
function palette(q) {
  const ql = q.trim().toLowerCase(), items = [];
  if (ql) {
    const p = parseQuick(q.trim());
    const toks = [p.q ? Q[p.q].n : null, p.projectId ? proj(p.projectId).name : p.newProj ? p.newProj + ' (פרויקט חדש)' : null, p.due ? dueInfo(p.due).t : null, p.est > 1 ? p.est + ' פומודורו' : null].filter(Boolean);
    if (p.title) items.push({ label: `הוספת משימה: <b>${esc(p.title)}</b>${toks.length ? `<span class="ptok">${toks.map(x => `<span>${esc(x)}</span>`).join('')}</span>` : ''}`, icon: 'plus', hint: 'Enter', always: true, run: () => { if (addTask(p)) { toast('המשימה נוספה'); render(); } } });
  }
  VIEWS.forEach(([id, n], i) => items.push({ label: 'מעבר ל' + n, icon: id, hint: String(i + 1), run: () => go(id) }));
  items.push({ label: running() ? 'השהיית הטיימר' : 'הפעלת הטיימר', icon: running() ? 'pause' : 'play', hint: 'רווח', key: 'טיימר פומודורו ריכוז', run: toggleTimer });
  items.push({ label: 'בלוק חדש בלוח השבועי', icon: 'week', run: () => newBlock() });
  items.push({ label: 'החלפת ערכת צבעים', icon: 'contrast', key: 'כהה בהיר', run: cycleTheme });
  items.push({ label: 'הגדרות', icon: 'settings', key: 'גיבוי פרויקטים', run: openSettings });
  const list = ql ? items.filter(it => it.always || (it.label + ' ' + (it.key || '')).toLowerCase().includes(ql)) : items;
  if (ql) state.tasks.filter(t => t.title.toLowerCase().includes(ql)).slice(0, 6).forEach(t => list.push({ label: esc(t.title), icon: 'tasks', hint: t.finished ? 'הושלמה' : Q[t.q].a, run: () => openTask(t.id) }));
  palItems = list; palSel = 0; renderPal();
}
function renderPal() {
  $('#pal-list').innerHTML = palItems.map((it, i) => `<li role="option" data-i="${i}" aria-selected="${i === palSel}">${ic(it.icon)}<span>${it.label}</span>${it.hint ? `<span class="hint">${it.hint}</span>` : ''}</li>`).join('');
  const sel = $('#pal-list [aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest' });
}
function runPal(i) { const it = palItems[i]; if (!it) return; closePalette(); it.run(); }
$('#pal-input').addEventListener('input', e => palette(e.target.value));
$('#pal-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palSel = Math.min(palItems.length - 1, palSel + 1); renderPal(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); renderPal(); e.preventDefault(); }
  else if (e.key === 'Enter') { e.preventDefault(); runPal(palSel); }
});
$('#pal-list').addEventListener('click', e => { const li = e.target.closest('li'); if (li) runPal(+li.dataset.i); });
$('#palette').addEventListener('click', e => { if (e.target.id === 'palette') closePalette(); });

function newBlock(day, startMin) {

  const b = { id: uid(), day: day || today(), title: '', start: fromMin(sm), end: fromMin(Math.min(sm + 60, 24 * 60 - 1)), projectId: null };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.dataset.confirm && !el.classList.contains('armed')) {
    e.preventDefault();
    el.classList.add('armed');
    if (!el.classList.contains('icon-btn')) { el.dataset.orig = el.innerHTML; el.textContent = 'לחיצה נוספת לאישור'; }
    setTimeout(() => { el.classList.remove('armed'); if (el.dataset.orig != null) { el.innerHTML = el.dataset.orig; delete el.dataset.orig; } }, 3000);
    return;
  }
  switch (act) {
    case 'go': go(el.dataset.v); break;
    case 'palette': openPalette(); break;
    case 'settings': openSettings(); break;
    case 'theme': cycleTheme(); break;
    case 'drawer-close': closeDrawer(); break;
    case 'new-task': openPalette(); break;
    case 'new-block': newBlock(); break;
    case 'open-task': openTask(id); break;
    case 'play-task': playTask(id); break;
    case 'toggle-task': {
      const t = task(id); t.finished = el.checked; t.finishedAt = el.checked ? Date.now() : null;
      if (t.finished && state.activeId === id) state.activeId = null;
      save(); if (t.finished) toast('כל הכבוד, המשימה הושלמה'); setTimeout(render, 160); break;
    }
    case 'task-del': state.tasks = state.tasks.filter(t => t.id !== id); if (state.activeId === id) state.activeId = null; save(); closeDrawer(); toast('המשימה נמחקה'); break;
    case 'block-del': state.blocks = state.blocks.filter(b => b.id !== id); save(); closeDrawer(); toast('הבלוק נמחק'); break;
    case 'sub-toggle': { const t = task(el.dataset.tid), s = t.subtasks.find(x => x.id === el.dataset.sid); s.d = el.checked; save(); if (!$('#drawer').hidden) openTask(t.id); else render(); break; }
    case 'sub-del': { const t = task(el.dataset.tid); t.subtasks = t.subtasks.filter(x => x.id !== el.dataset.sid); save(); openTask(t.id); break; }
    case 'timer-toggle': toggleTimer(); break;
    case 'timer-reset': setMode(T().mode); break;
    case 'timer-skip': skip(); break;
    case 'timer-finish': if (T().mode === 'focus' && remaining() < dur('focus')) complete(true); else toast('אין סבב ריכוז פתוח לרישום'); break;
    case 'mode': setMode(el.dataset.modeBtn); break;
    case 'fullscreen': { if (document.fullscreenElement) document.exitFullscreen?.(); else { const p = document.documentElement.requestFullscreen?.(); if (p) p.catch(() => toast('מסך מלא לא זמין כאן')); else toast('מסך מלא לא זמין כאן'); } break; }

    case 'tmode': state.ui.taskMode = el.dataset.m; save(); vTasks(); break;
    case 'wk': ui.weekOffset = el.dataset.d === '0' ? 0 : ui.weekOffset + +el.dataset.d; vWeek(); updateTimer(); break;
    case 'habit': { const h = state.habits.find(x => x.id === id), k = el.dataset.day; if (h.log[k]) delete h.log[k]; else h.log[k] = 1; save(); render(); break; }
    case 'habit-del': state.habits = state.habits.filter(h => h.id !== id); save(); render(); toast('ההרגל נמחק'); break;
    case 'pcolor': proj(id).color = el.dataset.c; save(); openSettings(); break;
    case 'pdel': state.projects = state.projects.filter(p => p.id !== id); state.tasks.forEach(t => { if (t.projectId === id) t.projectId = null; }); state.blocks.forEach(b => { if (b.projectId === id) b.projectId = null; }); save(); openSettings(); break;

document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.matches?.('.tr .body')) { openTask(el.dataset.id); return; }
  if (e.key === 'Enter' && el.matches?.('.wb')) { openBlock(el.dataset.bid); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'k' || e.code === 'KeyK')) { e.preventDefault(); $('#palette').hidden ? openPalette() : closePalette(); return; }
  if (e.key === 'Escape') { if (!$('#palette').hidden) closePalette(); else closeDrawer(); return; }
  if (el.closest?.('input, textarea, select, [contenteditable]')) return;
  if (!$('#palette').hidden || !$('#drawer').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-6]$/.test(e.key)) go(VIEWS[+e.key - 1][0]);
  else if (e.key === ' ' && !el.closest?.('button, [role=button]')) { e.preventDefault(); toggleTimer(); }
});

    if (f === 'q') v = +v;
    if (f === 'est') { if (!v) return; v = clamp(+v || 1, 1, 40); }
    if (f === 'due' || f === 'projectId') v = v || null;
    if (f === 'title' && !v.trim()) return;
    t[f] = v; save(); soon(); return;
  }
  if (el.dataset.bf) {
    const b = state.blocks.find(x => x.id === el.closest('[data-block]').dataset.block), f = el.dataset.bf;
    let v = el.value;
    if (f === 'projectId') v = v || null;
    if ((f === 'start' || f === 'end' || f === 'day') && !v) return;
    const prev = b[f]; b[f] = v;
    if (toMin(b.end) <= toMin(b.start)) {
      if (f === 'start') { b.end = fromMin(Math.min(toMin(b.start) + 60, 1439)); $('#bf-end').value = b.end; }
      else { b[f] = prev; el.setCustomValidity('שעת הסיום צריכה להיות אחרי שעת ההתחלה'); el.reportValidity(); return; }
    }
    el.setCustomValidity('');
    const l = $('#bf-len'); if (l) l.textContent = 'משך: ' + fmtH(toMin(b.end) - toMin(b.start));
    save(); soon(); return;
  }
  if (el.dataset.pname) { const p = proj(el.dataset.pname); if (el.value.trim()) { p.name = el.value.trim(); save(); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 't-proj') { ui.project = el.value; taskBody(); }
  else if (el.id === 't-done') { ui.showDone = el.checked; taskBody(); }
  else if (el.id === 'f-active') { state.activeId = el.value || null; save(); render(); }
  else if (el.dataset.sf) {
    const f = el.dataset.sf, s = S();
    if (f === 'autoBreak') s[f] = el.checked;
    else if (f === 'theme') { s[f] = el.value; applyTheme(); }
    else { const v = parseInt(el.value, 10); if (!isNaN(v)) s[f] = clamp(v, +el.min, +el.max); el.value = s[f]; }
    if (['focus', 'short', 'long'].includes(f) && !running()) T().remaining = dur(T().mode);
    save(); updateTimer();
  }
});
$('#scrim').addEventListener('click', closeDrawer);

/* matrix drag & drop */
let dragTask = null;
document.addEventListener('dragstart', e => { const li = e.target.closest?.('.tr[draggable]'); if (li) { dragTask = li.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragTask); } catch (err) {} } });
document.addEventListener('dragover', e => { const q = e.target.closest?.('.quad'); if (q && dragTask) { e.preventDefault(); $$('.quad').forEach(x => x.classList.toggle('drop', x === q)); } });
document.addEventListener('drop', e => { const q = e.target.closest?.('.quad'); if (!q || !dragTask) return; e.preventDefault(); const t = task(dragTask); if (t && t.q !== +q.dataset.q) { t.q = +q.dataset.q; save(); toast('הועבר ל"' + Q[t.q].n + '"'); } dragTask = null; taskBody(); });
document.addEventListener('dragend', () => { dragTask = null; $$('.quad').forEach(x => x.classList.remove('drop')); });

/* week: click on an empty slot */
document.addEventListener('click', e => {
  const col = e.target.classList?.contains('wcol') ? e.target : null; if (!col) return;
  const y = e.clientY - col.getBoundingClientRect().top;
  const m = clamp(Math.floor((S().dayStart * 60 + y / HH * 60) / 30) * 30, S().dayStart * 60, S().dayEnd * 60 - 30);
  newBlock(col.dataset.day, m);
});

/* ================= boot ================= */
applyTheme();
sky();
if (running() && remaining() <= 0) complete(false);
renderNav(); render();
setInterval(() => {
  sky();
  const busy = !$('#drawer').hidden || !$('#palette').hidden || drag || document.activeElement?.closest?.('input, textarea, select');
  if (!busy && (state.ui.view === 'week' || state.ui.view === 'today')) render();
}, 60000);
})();
</script>
